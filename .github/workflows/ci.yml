name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run cms:seed
      - run: npm run build
      # Production dependencies only. The full tree reports one unfixed high,
      # braces <=3.0.3 via eslint-config-next, and 3.0.3 is the newest release.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run ci:secrets
      - run: npm run db:check-migrations

  browser:
    name: browser
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run cms:seed
      - run: npm run build
      - run: npm run test:e2e
